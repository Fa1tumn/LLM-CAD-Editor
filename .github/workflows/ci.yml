name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FreeCAD is not pip-installable and is deliberately absent here: this job
      # covers the SymbolicBackend path only (parser, AST, registry, chain scoring).
      # Kernel regression tests run locally against FreeCAD — see CLAUDE.md.
      - name: Install dependencies
        run: pip install pytest pyyaml numpy ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q
